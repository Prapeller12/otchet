name: Windows portable preview

on:
  push:
    branches:
      - codex/portable-mvp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install build dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-release.txt
          "jsonschema==4.26.0"
          "pytest==8.4.2"

      - name: Fetch verified WebView2 Fixed Runtime
        shell: pwsh
        run: |
          $runtime = ./scripts/fetch_webview2.ps1 -Destination "$env:RUNNER_TEMP/webview2"
          "REPORTING_WEBVIEW2=$runtime" >> $env:GITHUB_ENV

      - name: Build portable preview
        shell: pwsh
        run: >-
          ./scripts/build_windows.ps1
          -WebView2RuntimePath $env:REPORTING_WEBVIEW2
          -OutputPath ./dist/portable

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $executable = (Resolve-Path "./dist/portable/ReportingSystem/ReportingSystem.exe").Path
          $report = [System.IO.Path]::GetFullPath(
            "./dist/portable/ReportingSystem/temp/self-test-result.txt"
          )
          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--self-test", "--self-test-report", $report) `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Packaged self-test failed."
          }
          if ((Get-Content $report -Raw).Trim() -ne "ok") {
            throw "Packaged self-test did not produce a success report."
          }

      - name: Test real window from extracted ZIP with Cyrillic path
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "Ручной тест отчётности"
          $zip = Get-ChildItem ./dist/portable/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $testRoot
          $app = Join-Path $testRoot "ReportingSystem"
          $report = Join-Path $app "temp/ui-result.txt"
          $process = Start-Process -FilePath (Join-Path $app "ReportingSystem.exe") `
            -ArgumentList @("--ui-self-test", "--self-test-report", "`"$report`"") -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw "Real WebView2 window timed out."
          }
          Copy-Item (Join-Path $app "temp/window-*.png") ./dist/portable -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            if (Test-Path $report) { Get-Content $report }
            throw "Real WebView2 window failed."
          }
          if ((Get-Content $report -Raw).Trim() -ne "ok") { throw "UI test failed." }

      - name: Upload window evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: window-evidence
          path: dist/portable/window-*.png
          if-no-files-found: ignore

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReportingSystem-${{ github.sha }}-windows-x64-test
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          $tag = "test-v$version"
          $assetPaths = @(
            Get-ChildItem ./dist/portable -File |
              Where-Object { $_.Extension -in ".zip", ".sha256" } |
              ForEach-Object { $_.FullName }
          )
          if ($assetPaths.Count -ne 2) { throw "Expected the ZIP and its SHA-256 file." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assetPaths --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assetPaths `
              --target $env:GITHUB_SHA `
              --prerelease `
              --title "Reporting System $version test build" `
              --notes "Windows x64 alpha. Compact five-digit numeric columns, monthly A4 PDF and local version-bound data confirmation. Read TESTING.txt, extract and run start.cmd. WebView2 Fixed Runtime included; real-window startup test required. Windows 10 ACL limitations: docs/decisions/ADR-0001-webview2-fixed-runtime-windows10-acl.md."
          }
