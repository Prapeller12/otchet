name: Windows portable preview

on:
  push:
    branches:
      - codex/portable-mvp
      - codex/cryptographic-report-verification
      - codex/reference-audit-dev23
      - codex/compact-head-header-dev25
      - codex/roles-and-simple-workspace-dev26
      - codex/report-workflow-dev27
      - codex/reference-frontend-dev29
      - codex/dev30-startup-cell-guidance
      - codex/dev32-hints-toggle
      - codex/dev33-recovery-excel-integration
      - codex/ui-drafts-blank-2027-dev34
      - codex/dev35-viewport-layout
      - codex/dev36-network-share
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare 1920x1080 desktop for native window evidence
        shell: pwsh
        run: ./scripts/set_ci_display.ps1 -Width 1920 -Height 1080

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install build dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-release.txt
          "jsonschema==4.26.0"
          "pytest==8.4.2"

      - name: Fetch verified WebView2 Fixed Runtime
        shell: pwsh
        run: |
          $runtime = ./scripts/fetch_webview2.ps1 -Destination "$env:RUNNER_TEMP/webview2"
          "REPORTING_WEBVIEW2=$runtime" >> $env:GITHUB_ENV

      - name: Build portable preview
        shell: pwsh
        run: >-
          ./scripts/build_windows.ps1
          -WebView2RuntimePath $env:REPORTING_WEBVIEW2
          -OutputPath ./dist/portable

      - name: Run frontend contracts and tests before release checks
        run: |
          npm run typecheck
          node frontend/tests/contracts/report-cell-contract.test.mjs
          npm run test:frontend

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $executable = (Resolve-Path "./dist/portable/ReportingSystem/ReportingSystem.exe").Path
          $report = [System.IO.Path]::GetFullPath(
            "./dist/portable/ReportingSystem/temp/self-test-result.txt"
          )
          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--self-test", "--self-test-report", $report) `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Packaged self-test failed."
          }
          if ((Get-Content $report -Raw).Trim() -ne "ok") {
            throw "Packaged self-test did not produce a success report."
          }

      - name: Test real window from extracted ZIP with Cyrillic path
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "Ручной тест отчётности"
          $zip = Get-ChildItem ./dist/portable/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $testRoot
          $app = Join-Path $testRoot "ReportingSystem"
          $report = Join-Path $app "temp/ui-result.txt"
          $process = Start-Process -FilePath (Join-Path $app "ReportingSystem.exe") `
            -ArgumentList @("--ui-self-test", "--self-test-report", "`"$report`"") -PassThru
          if (-not $process.WaitForExit(300000)) {
            Stop-Process -Id $process.Id -Force
            throw "Real WebView2 window timed out."
          }
          Copy-Item (Join-Path $app "temp/window-*.png") ./dist/portable -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            if (Test-Path $report) { Get-Content $report }
            throw "Real WebView2 window failed."
          }
          if ((Get-Content $report -Raw).Trim() -ne "ok") { throw "UI test failed." }

      - name: Reopen saved database in a new process without a personal code
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP "Ручной тест отчётности/ReportingSystem"
          $report = Join-Path $app "temp/reopen-result.txt"
          $process = Start-Process -FilePath (Join-Path $app "ReportingSystem.exe") `
            -ArgumentList @("--ui-reopen-test", "--self-test-report", "`"$report`"") -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Automatic reopen timed out."
          }
          Copy-Item (Join-Path $app "temp/window-*.png") ./dist/portable -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            if (Test-Path $report) { Get-Content $report }
            throw "Automatic reopen failed."
          }
          if ((Get-Content $report -Raw).Trim() -ne "ok") { throw "Reopen test failed." }

      - name: Upload window evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: window-evidence-${{ matrix.os }}
          path: dist/portable/window-*.png
          if-no-files-found: ignore

      - name: Test native network bootstrap and encrypted snapshots over SMB
        timeout-minutes: 20
        shell: pwsh
        run: |
          $networkRoot = Join-Path $env:RUNNER_TEMP "Сетевой тест отчётности"
          $zip = Get-ChildItem ./dist/portable/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $networkRoot
          ./scripts/test_network_portable.ps1 `
            -ReleaseDirectory (Join-Path $networkRoot "ReportingSystem") `
            -EvidenceDirectory ./dist/network-evidence

      - name: Upload network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-evidence-${{ matrix.os }}
          path: dist/network-evidence/*
          if-no-files-found: ignore

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReportingSystem-${{ github.sha }}-${{ matrix.os }}-test
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download verified Windows Server 2025 package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ReportingSystem-${{ github.sha }}-windows-latest-test
          path: dist/portable

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          tag="test-v${version}-${GITHUB_SHA:0:12}"
          assets=(dist/portable/*.zip dist/portable/*.sha256)
          test "${#assets[@]}" -eq 2
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release already exists; cannot replace assets."
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --prerelease \
            --title "Reporting System $version test build" --notes-file docs/release/notes-dev36.md
