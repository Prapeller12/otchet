name: Windows portable preview

on:
  push:
    branches:
      - codex/portable-mvp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install build dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-release.txt
          "jsonschema==4.26.0"
          "pytest==8.4.2"

      - name: Build portable preview
        shell: pwsh
        run: >-
          ./scripts/build_windows.ps1
          -EvergreenTestBuild
          -OutputPath ./dist/portable

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $report = "./dist/portable/ReportingSystem/temp/self-test-result.txt"
          & ./dist/portable/ReportingSystem/ReportingSystem.exe `
            --self-test `
            --self-test-report $report
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Packaged self-test failed."
          }
          if ((Get-Content $report -Raw).Trim() -ne "ok") {
            throw "Packaged self-test did not produce a success report."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReportingSystem-${{ github.sha }}-windows-x64-test
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-v0.1.0-dev.0"
          $assetPaths = @(
            Get-ChildItem ./dist/portable -File |
              Where-Object { $_.Extension -in ".zip", ".sha256" } |
              ForEach-Object { $_.FullName }
          )
          if ($assetPaths.Count -ne 2) { throw "Expected the ZIP and its SHA-256 file." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assetPaths --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assetPaths `
              --target $env:GITHUB_SHA `
              --prerelease `
              --title "Reporting System 0.1.0 test build" `
              --notes "Windows x64 preview for manual testing. Unzip the archive and run start.cmd. Uses the system WebView2 Runtime."
          }
