name: Repository quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend quality tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Python quality tools
        run: >-
          python -m pip install --disable-pip-version-check
          "jsonschema==4.26.0"
          "mypy==1.20.2"
          "pytest==8.4.2"
          "ruff==0.16.5"

      - name: Verify repository
        run: python scripts/verify_repository.py

      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check backend scripts
          python -m ruff check backend scripts

      - name: Check Python types
        run: python -m mypy backend scripts

      - name: Run backend tests
        run: python -m pytest

      - name: Check frontend types
        run: npm run typecheck

      - name: Check report-cell contract
        run: node frontend/tests/contracts/report-cell-contract.test.mjs

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Verify frontend offline policy
        run: >-
          python -c "from pathlib import Path;
          from scripts.verify_release import verify_frontend_network_policy;
          verify_frontend_network_policy(Path('dist/frontend'))"
